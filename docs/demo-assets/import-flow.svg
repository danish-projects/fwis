<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Data import workflow">
  <rect width="720" height="200" fill="#f8fafc"/>
  <text x="360" y="24" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Historical Data Import (Google Sheets to FWIS)</text>
  <rect x="20" y="50" width="110" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="75" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e40af">1. Template</text>
  <text x="75" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Excel file</text>
  <rect x="150" y="50" width="110" height="48" rx="6" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="205" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#3730a3">2. Google Sheet</text>
  <text x="205" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">School fills data</text>
  <rect x="280" y="50" width="110" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="335" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#92400e">3. Download</text>
  <text x="335" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">.xlsx export</text>
  <rect x="410" y="50" width="110" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="465" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#166534">4. Dry run</text>
  <text x="465" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Validate only</text>
  <rect x="540" y="50" width="110" height="48" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="595" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#991b1b">5. Import</text>
  <text x="595" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Load to DB</text>
  <path d="M130 74h20M260 74h20M390 74h20M520 74h20" stroke="#64748b" stroke-width="2" marker-end="url(#import-arrow)"/>
  <text x="360" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">One workbook = one school + one academic year. Re-import replaces that year only.</text>
  <text x="360" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Sheets: School Setup, Teachers, Students, Attendance, Assessments, Calendar</text>
  <defs><marker id="import-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
</svg>
