<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Student and enrollment model">
  <rect width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Student and Enrollment Model</text>
  <text x="360" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">One student record, many enrollments across years and schools</text>

  <!-- Student (global) -->
  <rect x="280" y="68" width="160" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Student</text>
  <text x="360" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155">Global record (name, gender, parent)</text>

  <!-- Arrow down -->
  <path d="M360 124v28" stroke="#64748b" stroke-width="2" marker-end="url(#enr-arrow)"/>
  <text x="360" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">enrolls each year</text>

  <!-- Enrollment (center hub) -->
  <rect x="250" y="158" width="220" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#166534">Student Enrollment</text>
  <text x="360" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155">Per school + academic year + classroom</text>
  <text x="360" y="216" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155">Status, behavior score, enrollment date</text>

  <!-- Parents of enrollment -->
  <rect x="20" y="168" width="100" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="70" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">School</text>
  <text x="70" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">Houston, etc.</text>

  <rect x="130" y="168" width="100" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="180" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Academic Year</text>
  <text x="180" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">2025-2026</text>

  <rect x="490" y="168" width="100" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="540" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Classroom</text>
  <text x="540" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">Grade 1 Boys</text>

  <rect x="600" y="168" width="100" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="650" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Teacher</text>
  <text x="650" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#64748b">Assigned</text>

  <path d="M120 190h10M230 190h20M470 190h20M590 190h10" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#enr-arrow)"/>

  <!-- Children of enrollment -->
  <path d="M360 222v24" stroke="#64748b" stroke-width="2" marker-end="url(#enr-arrow)"/>

  <rect x="40" y="258" width="130" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="105" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#92400e">Attendance</text>
  <text x="105" y="294" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Per Sunday</text>

  <rect x="190" y="258" width="130" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="255" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#92400e">Behavior History</text>
  <text x="255" y="294" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Score adjustments</text>

  <rect x="340" y="258" width="130" height="48" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="405" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#92400e">Assessment Scores</text>
  <text x="405" y="294" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Quizzes, exams</text>

  <rect x="490" y="258" width="130" height="48" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="555" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#6b21a8">Final Grade</text>
  <text x="555" y="294" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#475569">Letter, rank</text>

  <path d="M300 246l-155 20M360 246v12M420 246l155 20" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#enr-arrow)"/>

  <text x="360" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Same student can have separate enrollments in different years or after transferring schools</text>

  <defs>
    <marker id="enr-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
