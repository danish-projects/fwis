<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="FWIS architecture">
  <rect width="720" height="320" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0f172a">FWIS System Architecture</text>
  <rect x="40" y="50" width="140" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">Browser</text>
  <text x="110" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Admin / Teacher UI</text>
  <rect x="240" y="50" width="160" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#14532d">Next.js 16</text>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Server Actions + API</text>
  <rect x="460" y="50" width="120" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#78350f">Supabase Auth</text>
  <text x="520" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Login and sessions</text>
  <rect x="620" y="50" width="60" height="56" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="650" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#581c87">Prisma</text>
  <path d="M180 78h60" stroke="#64748b" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <path d="M400 78h60" stroke="#64748b" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <path d="M580 78h40" stroke="#64748b" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <rect x="180" y="150" width="360" height="64" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="360" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#312e81">PostgreSQL (Supabase)</text>
  <text x="360" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Schools, Enrollments, Attendance, Grades, Audit logs</text>
  <path d="M320 106v44" stroke="#64748b" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <path d="M650 106v72h-290v44" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arch-arrow)"/>
  <rect x="40" y="240" width="640" height="56" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0f172a">CLI Tools (outside the web app)</text>
  <text x="360" y="280" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Excel import, Database seed, Purge, Template generator</text>
  <defs>
    <marker id="arch-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
