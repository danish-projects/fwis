<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Role access model">
  <rect width="720" height="300" fill="#f8fafc"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Role-Based Access Control</text>
  <rect x="40" y="50" width="150" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="115" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Super Admin</text>
  <text x="115" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">All 5 campuses</text>
  <rect x="210" y="50" width="150" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="285" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#1e40af">School Admin</text>
  <text x="285" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">One assigned school</text>
  <rect x="380" y="50" width="150" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="455" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#166534">Teacher</text>
  <text x="455" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Assigned classroom(s)</text>
  <rect x="550" y="50" width="130" height="70" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="615" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#334155">Read Only</text>
  <text x="615" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">View + export</text>
  <rect x="80" y="160" width="560" height="110" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0f172a">What each role can do in the web app</text>
  <text x="100" y="212" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Super Admin: schools, all data, cross-campus reports, audit log</text>
  <text x="100" y="232" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">School Admin: calendar, teachers, students, enrollments, attendance oversight</text>
  <text x="100" y="252" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Teacher: my dashboard, attendance entry, assessment scores (mobile-friendly)</text>
  <text x="100" y="272" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Read Only: reports and read access without editing</text>
</svg>
